# Orquesta el proyecto completo (BD + backend + frontend) para un
# despliegue en servidor propio (VPS). No reemplaza a
# backend/docker-compose.yml, que sigue siendo el flujo de solo-backend
# para desarrollo local; este archivo agrega el servicio `frontend` y
# vive en la raíz para levantar todo junto con un solo comando.
#
# Uso:
#   cp backend/.env.example backend/.env   # llenar credenciales/JWT_SECRET reales
#   cp .env.example .env                   # llenar PUBLIC_API_BASE_URL
#   docker compose build
#   docker compose up -d
#   docker compose exec backend npm run migrate
#   docker compose exec backend npm run seed   # o el import real de backend/data/
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en backend/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - indi_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Igual que en backend/docker-compose.yml: dentro de la red interna
      # de Docker el host de Postgres es el nombre del servicio (`db`),
      # no "localhost" como en la DATABASE_URL pensada para el host.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - indi_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: ${PUBLIC_API_BASE_URL:?Falta PUBLIC_API_BASE_URL en .env (raíz) — URL pública del backend}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  indi_pgdata:
  indi_uploads:
