server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # para que go_router resuelva la navegación en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
