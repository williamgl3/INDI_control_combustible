name: indi_combustible
description: "Sistema de control de combustible para flotillas de Grupo INDI."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  csv: ^6.0.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# Config de flutter_launcher_icons (`dart run flutter_launcher_icons`) — ícono
# de la app con el logo de marca sobre fondo azul (#1463FF, azul de marca INDI).
#
# `logo_indi.jpeg` (fondo azul + marca blanca, sin transparencia) se usa tal
# cual para íconos "planos" (iOS/web/Windows, que componen una sola imagen
# cuadrada). Para el ícono ADAPTATIVO de Android, en cambio, el foreground
# usa `logo_indi_mark.png` — la misma marca recortada a transparencia y
# repadeada al ~55% del lienzo — porque Android recorta el foreground a
# distintas formas (círculo, squircle, etc.) según el launcher; pegar el
# logo plano completo ahí cortaba el wordmark en los bordes.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_indi.jpeg"
  adaptive_icon_background: "#1463FF"
  adaptive_icon_foreground: "assets/images/logo_indi_mark.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo_indi.jpeg"
    background_color: "#1463FF"
    theme_color: "#1463FF"
  windows:
    generate: true
    image_path: "assets/images/logo_indi.jpeg"

# Config de flutter_native_splash (`dart run flutter_native_splash:create`) —
# splash screen con el logo centrado sobre fondo azul de marca, en claro Y
# oscuro (mismo azul en ambos: es una superficie de marca fija, no sigue el
# tema del sistema — mismo criterio que `sidebarBackground`/`headerBackground`
# en el design system). Usa la marca transparente (`logo_indi_mark.png`) para
# que no se vea un cuadro azul de fondo del propio logo sobre el fondo del
# splash.
flutter_native_splash:
  color: "#1463FF"
  image: assets/images/logo_indi_mark.png
  color_dark: "#1463FF"
  image_dark: assets/images/logo_indi_mark.png
  android_12:
    image: assets/images/logo_indi_mark.png
    icon_background_color: "#1463FF"
    image_dark: assets/images/logo_indi_mark.png
    icon_background_color_dark: "#1463FF"
  web: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Inter (variable) e IBM Plex Mono empaquetados localmente — antes se
  # pedían en runtime vía el paquete `google_fonts`, lo que exige conexión
  # a internet la primera vez que se usan (mal encaje con una app que ya
  # tiene toda una cola offline para choferes sin señal en obra). Inter es
  # variable font (un solo archivo cubre todos los pesos); IBM Plex Mono
  # sí necesita un archivo por peso.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
